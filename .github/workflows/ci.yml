name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "部署 Worker（需要 CLOUDFLARE_* secrets；上游 UPSTREAM/API_TOKEN 请提前用 wrangler secret put 配好）"
        type: boolean
        default: false

# 同一分支的新推送把上一次的跑作废，省 runner。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 测试 / 类型检查 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: 安装依赖
        run: bun install

      - name: 类型检查（apps/server + apps/worker）
        run: bun run typecheck:apps

      - name: 类型检查（packages）
        run: bun run typecheck:packages

      - name: 类型检查（studio）
        # 基线（本分支之前）就不是绿的：ScenePanel/TwinSceneController/
        # entityMeshes、`_tsmoke.ts` 共十余处存量错误，与本分支无关。
        # 先不挡门禁，修完再改成阻塞。
        continue-on-error: true
        run: bun run --filter @twin-platform/studio typecheck

      - name: 单元测试
        # 超时写在用例自己身上（见 closedLoop.test.ts 的 simTest），这里不加全局 flag。
        run: bun run test

      - name: 构建 Studio
        run: bun run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: apps/studio/dist/client
          retention-days: 7

  deploy:
    name: 部署 Worker
    # 只有手动触发且勾了 deploy 才跑：本分支的 server 还在本地，没有公网上游。
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    env:
      # secrets 上下文不能直接出现在 step 的 if 里，借道 env 判断。
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: 安装依赖
        if: env.HAS_CLOUDFLARE == 'true'
        run: bun install

      - name: 构建 Studio（Worker 的静态资产来自 dist/client）
        if: env.HAS_CLOUDFLARE == 'true'
        run: bun run build

      - name: 部署
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: apps/worker
        run: bunx wrangler deploy

      - name: 提示未配置 secrets
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "::notice::跳过部署：缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets。"
          echo "配置后在 Actions 里手动触发本 workflow 并勾选 deploy。"
